name: Build PC control test app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Compile UIKit test app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload/InputTest.app
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -miphoneos-version-min=15.0 -fobjc-arc -framework UIKit -framework Foundation InputTest/main.m -o Payload/InputTest.app/InputTest
          python3 - <<'PY'
          import plistlib
          data = dict(CFBundleExecutable='InputTest', CFBundleIdentifier='local.secondscreen.inputtest', CFBundleName='PC Control Test', CFBundleDisplayName='PC Control Test', CFBundlePackageType='APPL', CFBundleShortVersionString='1.0', CFBundleVersion='1', MinimumOSVersion='15.0', LSRequiresIPhoneOS=True, UILaunchScreen={}, NSLocalNetworkUsageDescription='Share this test app with your PC on your local network.', UISupportedInterfaceOrientations=['UIInterfaceOrientationPortrait'])
          with open('Payload/InputTest.app/Info.plist', 'wb') as f:
              plistlib.dump(data, f)
          PY
          zip -qr PC-Control-Test.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Control-Test
          path: PC-Control-Test.ipa
          if-no-files-found: error
